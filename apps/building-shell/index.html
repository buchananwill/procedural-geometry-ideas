<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building shell viewer</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; --bg: #14181f; --panel: #1c222b; --line: #313a47; --text: #e6eaf0; --dim: #98a3b3; --bad: #ff5c8a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    #app { display: flex; height: 100%; }
    #view { flex: 1; min-width: 0; position: relative; }
    #view canvas { display: block; }
    #status { position: absolute; left: 164px; bottom: 10px; color: var(--dim); pointer-events: none; }
    #panel { width: 380px; flex: none; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px 24px; }
    h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
    h2:first-child { margin-top: 0; }
    select, button { font: inherit; color: var(--text); background: #262e3a; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
    select { width: 100%; }
    /* The selector's filter (WP-V1). */
    .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .filter-row .hint { margin-top: 0; white-space: nowrap; }
    #fixture-filter { flex: 1; min-width: 0; font: inherit; color: var(--text); background: #171c24; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    label.toggle { display: inline-flex; align-items: center; gap: 5px; margin: 0 12px 4px 0; cursor: pointer; }
    .readout { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-height: 3.2em; background: #171c24; }
    .readout.pinned { border-color: #fff176; }
    .readout .title { font-weight: 600; }
    .readout p { margin: 0 0 6px; }
    .readout p:last-child { margin: 0; }
    .readout .line { display: block; color: var(--text); }
    .readout .empty, .readout .dim { color: var(--dim); }
    .readout.case { margin-top: 8px; border-color: var(--bad); }
    .readout.case ul { margin: 2px 0 6px; padding-left: 18px; }
    .readout .bad { color: var(--bad); }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 1px 4px 1px 0; vertical-align: top; }
    th { font-weight: 600; color: var(--dim); padding-top: 6px; }
    .swatch { display: inline-block; width: 22px; height: 11px; border: 1px solid #0006; vertical-align: middle; margin-right: 6px; }
    .count { color: var(--dim); text-align: right; white-space: nowrap; }
    .zero { opacity: .5; }
    .bad { color: var(--bad); }
    .report dt { color: var(--dim); }
    .report dd { margin: 0 0 4px 0; }
    .report ul { margin: 0; padding-left: 18px; }
    pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 11px; color: var(--dim); }
    .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
    /* The editor (viewer editing decisions 13 and 14). */
    #edit button { margin: 0 0 4px 0; }
    #edit button:disabled { opacity: .45; }
    #edit input.num { width: 64px; font: inherit; color: var(--text); background: #171c24; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    #edit select { width: auto; padding: 2px 4px; }
    #edit .default { color: var(--dim); }
    #edit .invalid { border-color: var(--bad); outline: 1px solid var(--bad); }
    #edit .edit-title { font-weight: 600; margin-bottom: 6px; }
    #edit .ring-row { display: flex; gap: 4px; align-items: center; margin-bottom: 3px; border: 1px solid transparent; border-radius: 4px; }
    #edit .ring-row.sel { border-color: #4dd0e1; background: #1a2a31; }
    #edit .ring-row.invalid { border-color: var(--bad); }
    #edit .ring-pick { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; }
    #edit .ring-row button { margin: 0; padding: 2px 6px; }
    #edit .ring-fields { margin: 8px 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; }
    #edit .fields-title { font-weight: 600; margin-bottom: 4px; }
    #edit .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
    #edit label.inline { display: inline-flex; align-items: center; gap: 4px; }
    #edit .side-name { width: 14px; color: var(--dim); }
    /* The run list of a side (journal decision 210). */
    #edit details.runs { margin: 0 0 6px 20px; }
    #edit details.runs > summary { cursor: pointer; color: var(--dim); }
    #edit details.runs > summary.invalid { color: var(--bad); }
    #edit .run-list { margin: 4px 0; }
    #edit .row.run { padding: 3px 0; border-top: 1px solid var(--line); }
    #edit .row.run.invalid { border-color: var(--bad); }
    #edit .row.run input.num { width: 56px; }
    /* A gable stretch's settings (per-stretch gable settings decision 16): a line of their own under the stretch's, indented. */
    #edit .row.run .gable-settings { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; flex-basis: 100%; padding-left: 16px; }
    #edit .row.run .gable-settings[hidden] { display: none; }
    #edit .refusals, #edit .notice { margin-top: 6px; }
    #edit .notice { white-space: pre-wrap; }
    #edit .refusals ul { margin: 2px 0; padding-left: 18px; }
    #edit input.link { width: 100%; margin-top: 4px; font: 11px/1.3 monospace; color: var(--dim); background: #171c24; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  </style>
</head>
<body>
<div id="app">
  <div id="view"><div id="status">Loading manifold-3d...</div></div>
  <aside id="panel">
    <h2>Fixture</h2>
    <div class="filter-row"><input id="fixture-filter" type="search" placeholder="Filter: words in a name, title or group" aria-label="Filter the fixture list"><span id="filter-count" class="hint"></span></div>
    <select id="fixture" aria-label="Fixture or defect case"></select>
    <div id="fixture-note" class="hint"></div>
    <div id="manifest-note" class="hint bad"></div>
    <div id="buildline" class="hint"></div>
    <div id="case" class="readout case" hidden></div>

    <h2>Edit</h2>
    <div id="edit"></div>

    <h2>Readout</h2>
    <div id="pinned" class="readout pinned" hidden></div>
    <div id="hover" class="readout" style="margin-top:6px"></div>
    <div class="hint">Drag orbits, wheel dollies, right-drag tracks. Hover to read; click pins, Esc or empty space unpins.</div>

    <h2>Show</h2>
    <div id="layers"></div>
    <div id="storeys"></div>
    <div><button id="reset" type="button">Reset view</button> <button id="frame-all" type="button">Frame whole shell</button></div>

    <h2>Legend</h2>
    <div id="legend"></div>

    <h2>Shell report</h2>
    <div id="report" class="report"></div>
  </aside>
</div>
<script type="module" src="/src/viewer/main.ts"></script>
</body>
</html>
